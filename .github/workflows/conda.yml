name: Conda Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag name of the release to attach the conda package to (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-conda:
    name: Build Conda Package (Linux)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Tag Name
        id: get_tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Conda package
        uses: prefix-dev/rattler-build-action@v0.2.31
        with:
          recipe-path: recipe/recipe.yaml

      - name: Upload Conda Package to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          echo "Targeting release: $TAG"
          
          # Wait for the release to exist (useful to avoid race conditions with standard release workflows)
          for i in {1..20}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG found!"
              break
            fi
            echo "Release $TAG not found yet. Waiting 30 seconds (attempt $i of 20)..."
            sleep 30
          done
          
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Error: Release $TAG was not created in time."
            exit 1
          fi
          
          # Find all .conda and .tar.bz2 files in output/
          FILES=$(find output -type f \( -name "*.conda" -o -name "*.tar.bz2" \))
          if [ -z "$FILES" ]; then
            echo "No conda packages found to upload."
            exit 1
          fi
          
          echo "Found files to upload:"
          echo "$FILES"
          gh release upload "$TAG" $FILES --clobber
