[package]
name = "wisteria"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/katalyxbio/wisteria"

[dependencies]
noodles = { version = "0.110.0", features = ["bam", "bgzf"] }
# Direct dep purely to enable libdeflate on noodles-bgzf: Cargo feature-unifies
# it onto the same crate instance `noodles` uses, switching the BGZF block-inflate
# backend from zlib-rs to libdeflate (faster bulk decompression on the BAM path).
noodles-bgzf = { version = "0.47", features = ["libdeflate"] }
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# zlib-ng backend (feature-unified onto needletail's flate2) makes the serial
# plain-gzip FASTQ fallback ~2-3x faster than the default miniz_oxide backend.
# BGZF-compressed FASTQ instead decodes in parallel via noodles (see io/fastq.rs)
# and doesn't use this path. Requires cmake + a C compiler at build time.
flate2 = { version = "1.0", features = ["zlib-ng"] }
needletail = "0.6"
num_cpus = "1.16"
# Rust-native plotting for `--plots`. Pure-Rust config: bitmap (PNG) backend +
# ab_glyph font rasterizer (no freetype/font-kit C deps, unlike the default `ttf`
# feature). bitmap_encoder writes PNG via the pure-Rust `image` crate.
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "ab_glyph",
    "line_series",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3  # Optimize dependencies in dev

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
