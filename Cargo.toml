[package]
name = "wisteria"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/katalyxbio/wisteria"

[dependencies]
noodles = { version = "0.110.0", features = ["bam", "bgzf"] }
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
needletail = "0.6"
num_cpus = "1.16"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3  # Optimize dependencies in dev

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
